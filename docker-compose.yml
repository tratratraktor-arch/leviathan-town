services:
  mongo:
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  game:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8090:8090"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./logs:/app/logs

volumes:
  mongo-data:
