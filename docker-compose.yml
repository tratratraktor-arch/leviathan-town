services:
  mongo:
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  game:
    image: ghcr.io/tratratraktor-arch/leviathan-town:latest
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "${GAME_BIND:-8090}:8090"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./logs:/app/logs

volumes:
  mongo-data:
